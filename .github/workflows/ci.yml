name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e . pytest
      # Byte-compile the whole tree so a syntax error fails CI even when there are no tests.
      - run: python -m compileall -q .
      # -q; tolerate exit code 5 ("no tests collected") so a repo without tests still passes.
      - run: pytest -q || [ $? -eq 5 ]
