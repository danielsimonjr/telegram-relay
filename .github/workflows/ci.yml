name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e . pytest
      # Byte-compile the whole tree so a syntax error fails CI even when there are no tests.
      - run: python -m compileall -q .
      # -q; tolerate exit code 5 ("no tests collected") so a repo without tests still passes.
      - run: pytest -q || [ $? -eq 5 ]
